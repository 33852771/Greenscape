<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenScape Landscaping</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      background: #f3f4f6;
      color: #333;
    }

    header {
      background: #2e8b57;
      color: white;
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
    }

    .hero {
      background: url('https://source.unsplash.com/1600x600/?garden,landscape') no-repeat center center/cover;
      color: white;
      padding: 100px 20px;
      text-align: center;
    }

    .form-section {
      padding: 40px 20px;
      background-color: white;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    form {
      display: flex;
      flex-direction: column;
    }

    form input, form select, form textarea {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 1rem;
    }

    form button {
      padding: 10px;
      background: #2e8b57;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    form button:hover {
      background: #246b45;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 10px 0;
      margin-top: 40px;
      font-size: 0.9rem;
    }

    .hero h2 {
      font-size: 2rem;
    }

    .hero p {
      font-size: 1.2rem;
    }

    @media (min-width: 600px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        padding: 1rem 2rem;
        text-align: left;
      }

      nav {
        margin-top: 0;
      }

      nav a {
        margin: 0 10px;
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding: 60px 15px;
      }

      .hero h2 {
        font-size: 1.5rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }

    @media (max-width: 500px) {
      form input, form select, form textarea,
      form button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>GreenScape Landscaping</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#estimate">Estimator</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home" class="hero" data-aos="fade-up" style="color: #222;">
    <h2>Your Dream Landscape Starts Here</h2>
    <p>Professional and eco-friendly landscaping services.</p>
  </section>

  <section id="estimate" class="form-section" data-aos="fade-right">
    <h2>Project Cost Estimator</h2>
    <form id="estimatorForm">
      <label for="yardSize">Yard Size (in sq. meters):</label>
      <input type="number" id="yardSize" name="yardSize" required />

      <label for="design">Design Option:</label>
      <select id="design" name="design">
        <option value="basic">Basic</option>
        <option value="premium">Premium</option>
        <option value="deluxe">Deluxe</option>
      </select>

      <fieldset>
        <legend>Extra Features:</legend>
        <label><input type="checkbox" name="extras" value="fountain" /> Fountain</label>
        <label><input type="checkbox" name="extras" value="lighting" /> Lighting</label>
        <label><input type="checkbox" name="extras" value="decking" /> Decking</label>
      </fieldset>

      <button type="button" onclick="calculateCost()">Calculate</button>
    </form>
    <p id="result"></p>
  </section>

  <section id="contact" class="form-section" data-aos="fade-left">
    <h2>Contact Us</h2>
    <form action="https://formsubmit.co/your-email@example.com" method="POST">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 GreenScape Landscaping</p>
  </footer>

  <script>
    function calculateCost() {
      const yardSize = parseFloat(document.getElementById("yardSize").value);
      const design = document.getElementById("design").value;
      const extras = document.querySelectorAll('input[name="extras"]:checked');

      if (isNaN(yardSize) || yardSize <= 0) {
        document.getElementById("result").innerText = "Please enter a valid yard size.";
        return;
      }

      let ratePerSqM = {
        basic: 10,
        premium: 15,
        deluxe: 20
      };

      let baseCost = yardSize * ratePerSqM[design];
      let extraCost = extras.length * 100;
      let total = baseCost + extraCost;

      document.getElementById("result").innerText = `Estimated Cost: $${total.toFixed(2)}`;
    }
  </script>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
